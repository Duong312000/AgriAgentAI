<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trò chuyện với AgriAgent AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .chat-icon-btn {
      color: #63731a;
      font-size: 20px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .chat-icon-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div class="web-container">
    <div class="app-content" style="background-color: #FFFAD4;">

      <!-- Header Top: Sunny Yellow, No Call Buttons -->
      <div style="background-color: #fde047; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #facc15;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <a href="javascript:history.back()" style="color: #111827; text-decoration: none; font-size: 18px; display: flex; align-items: center;">
            <i class="fa-solid fa-chevron-left"></i>
          </a>
          <img src="../image/logo.png" alt="Logo" style="height: 32px; width: auto;">
          <span style="font-size: 20px; font-weight: 800; color: #111827;">AgriAgent AI</span>
        </div>
        <!-- Right side empty (Call/Video buttons deleted as requested) -->
      </div>

      <!-- Main Chat Area -->
      <div style="padding: 24px 18px; flex: 1; background-color: #FFFAD4; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;">

        <!-- Message 1: AI (Left Aligned) -->
        <div style="display: flex; gap: 10px; align-items: flex-end; max-width: 85%;">
          <img src="../image/logo.png" alt="AI Avatar" style="width: 26px; height: 26px; flex-shrink: 0; margin-bottom: 4px;">
          <div style="background-color: #ffffff; padding: 14px 18px; border-radius: 22px 22px 22px 6px; font-size: 15px; color: #111827; font-weight: 500; line-height: 1.4; box-shadow: 0 3px 10px rgba(0,0,0,0.05);">
            Chào bạn, bạn có thắc mắc gì không ?
          </div>
        </div>

        <!-- Message 2: User (Right Aligned) -->
        <div style="align-self: flex-end; max-width: 82%; background-color: #4f52ff; color: #ffffff; padding: 14px 18px; border-radius: 22px 22px 6px 22px; font-size: 15px; font-weight: 500; line-height: 1.4; box-shadow: 0 4px 12px rgba(79, 82, 255, 0.3);">
          Tôi muốn hỏi về giá thành và cách chăm cây
        </div>

        <!-- Message 3: AI (Left Aligned) -->
        <div style="display: flex; gap: 10px; align-items: flex-end; max-width: 85%;">
          <img src="../image/logo.png" alt="AI Avatar" style="width: 26px; height: 26px; flex-shrink: 0; margin-bottom: 4px;">
          <div style="background-color: #ffffff; padding: 14px 18px; border-radius: 22px 22px 22px 6px; font-size: 15px; color: #111827; font-weight: 500; line-height: 1.4; box-shadow: 0 3px 10px rgba(0,0,0,0.05);">
            Mình hiểu ý bạn rồi ! Hãy cho mình thêm thông tin về sản phẩm của bạn nhé, đừng ngần ngại
          </div>
        </div>

      </div>

      <!-- Bottom Chat Bar -->
      <div style="background-color: #fde047; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #facc15;">
        <i class="fa-solid fa-paper-plane chat-icon-btn"></i>
        <i class="fa-solid fa-camera chat-icon-btn"></i>
        <i class="fa-regular fa-image chat-icon-btn"></i>
        <i class="fa-solid fa-microphone chat-icon-btn"></i>

        <div style="flex: 1; position: relative; display: flex; align-items: center;">
          <input type="text" placeholder="Aa" style="width: 100%; border: none; outline: none; padding: 10px 40px 10px 16px; border-radius: 22px; background-color: rgba(0,0,0,0.08); font-size: 15px; font-family: inherit; color: #111827; box-sizing: border-box;">
          <i class="fa-regular fa-face-smile chat-icon-btn" style="position: absolute; right: 12px; font-size: 19px;"></i>
        </div>

        <i class="fa-solid fa-thumbs-up chat-icon-btn" style="font-size: 22px;"></i>
      </div>

    </div>
  </div>
</body>

</html>
