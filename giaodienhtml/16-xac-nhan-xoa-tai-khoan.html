<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Xóa tài khoản - Trang cá nhân</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="web-container" style="background-color: #ffffff; position: relative;">
    <div class="app-content" style="padding-bottom: 120px; background-color: #ffffff;">

      <!-- Top Divider Line -->
      <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 16px 20px 20px 20px;">

      <!-- Profile Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 20px 20px;">
        <h2 style="font-size: 24px; font-weight: 500; color: #2d3748; margin: 0;">Tiến Thành</h2>
        <div style="width: 52px; height: 52px; background-color: #8c9e37; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #ffffff;">
          <i class="fa-solid fa-user" style="font-size: 28px;"></i>
        </div>
      </div>

      <!-- Divider Line -->
      <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 0 20px 20px 20px;">

      <!-- Quản lý đơn hàng Header -->
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 16px 20px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <i class="fa-regular fa-file-lines" style="font-size: 22px; color: #2d3748;"></i>
          <span style="font-size: 17px; font-weight: 500; color: #2d3748;">Quản lý đơn hàng</span>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 16px; color: #2d3748;"></i>
      </div>

      <!-- Divider Line -->
      <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 0 20px 24px 20px;">

      <!-- 6 Order Status Cards Grid -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 0 20px 30px 20px;">

        <div style="background: #ffffff; border: 1.5px solid #1c4b27; border-radius: 18px; padding: 16px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 115px; box-sizing: border-box;">
          <div style="position: relative; margin-bottom: 10px; display: inline-block;">
            <i class="fa-solid fa-bag-shopping" style="font-size: 28px; color: #8c9e37;"></i>
            <i class="fa-solid fa-pen" style="position: absolute; top: -2px; right: -6px; font-size: 10px; color: #8c9e37; background: #ffffff; padding: 1px; border-radius: 50%;"></i>
          </div>
          <div style="font-size: 14px; font-weight: 500; color: #2d3748; line-height: 1.3;">Xác nhận<br>đơn hàng</div>
        </div>

        <!-- Card 2 -->

          <div style="position: relative; margin-bottom: 10px; display: inline-block;">
            <i class="fa-solid fa-bag-shopping" style="font-size: 28px; color: #8c9e37;"></i>
            <i class="fa-solid fa-truck-fast" style="position: absolute; top: -2px; right: -7px; font-size: 10px; color: #8c9e37; background: #ffffff; padding: 1px; border-radius: 50%;"></i>
          </div>
          <div style="font-size: 14px; font-weight: 500; color: #2d3748; line-height: 1.3;">Theo dõi<br>đơn hàng</div>
        </div>

        <!-- Card 3 -->
        <div style="background: #ffffff; border: 1.5px solid #1c4b27; border-radius: 18px; padding: 16px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 115px; box-sizing: border-box;">
          <div style="margin-bottom: 10px; display: inline-block;">
            <i class="fa-solid fa-bag-shopping" style="font-size: 28px; color: #8c9e37;"></i>
          </div>

          <div style="position: relative; margin-bottom: 10px; display: inline-block;">
            <i class="fa-solid fa-bag-shopping" style="font-size: 28px; color: #8c9e37;"></i>
            <div style="position: absolute; bottom: -2px; right: -5px; background: #ffffff; border-radius: 50%; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center;">
              <i class="fa-solid fa-rotate-left" style="font-size: 9px; color: #8c9e37;"></i>
            </div>
          </div>
          <div style="font-size: 14px; font-weight: 500; color: #2d3748; line-height: 1.3;">Trả hàng</div>

          <div style="position: relative; margin-bottom: 10px; display: inline-block;">
            <i class="fa-solid fa-bag-shopping" style="font-size: 28px; color: #8c9e37;"></i>

              <i class="fa-solid fa-check" style="font-size: 10px; color: #8c9e37; font-weight: 900;"></i>
            </div>
          </div>
          <div style="font-size: 14px; font-weight: 500; color: #2d3748; line-height: 1.3;">Đơn đã<br>hoàn thành</div>
        </div>

        <!-- Card 6 -->
        <div style="background: #ffffff; border: 1.5px solid #1c4b27; border-radius: 18px; padding: 16px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; height: 115px; box-sizing: border-box;">
          <div style="margin-bottom: 10px; display: inline-block;">
            <i class="fa-solid fa-circle-xmark" style="font-size: 28px; color: #8c9e37;"></i>
          </div>
          <div style="font-size: 14px; font-weight: 500; color: #2d3748; line-height: 1.3;">Đơn đã hủy</div>
        </div>

      </div>

            <span style="font-size: 16px; font-weight: 500; color: #2d3748;">Thông tin cá nhân</span>

          <i class="fa-solid fa-chevron-right" style="font-size: 16px; color: #2d3748;"></i>

        </a>
        <a href="#" class="nav-item active">

        <!-- Modal Card -->

          <p style="font-size: 16px; font-weight: 600; color: #252536; margin: 0 20px 28px 20px; line-height: 1.4;">
            Bạn có chắc chắn muốn xóa<br>tài khoản?
          </p>

          <div style="display: grid; grid-template-columns: 1fr 1fr; border-top: 1.5px solid #2e5420;">
            <a href="01-man-hinh-chao.html" style="padding: 16px 10px; font-size: 16px; font-weight: 700; color: #e11d48; text-decoration: none; text-align: center; border-right: 1.5px solid #2e5420; background: #ffffff;">Xóa</a>
            <a href="13-ca-nhan.html" style="padding: 16px 10px; font-size: 16px; font-weight: 700; color: #252536; text-decoration: none; text-align: center; background: #ffffff;">Không xóa</a>
          </div>

        </div>

      </div>

    </div>
